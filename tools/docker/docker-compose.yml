# Use the following command to ensure permissions match the host
# docker compose build --build-arg USER_ID=$(id -u) --build-arg GROUP_ID=$(id -g)

services:
  darling_dev:
    entrypoint: /bin/bash
    build:
      context: '.'
      dockerfile: './Dockerfile'
      args:
        USER_ID: 1000
        GROUP_ID: 1000
    stdin_open: true
    tty: true
    volumes:
      - type: bind
        source: ../..
        target: /src/darling
